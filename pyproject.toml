[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monthly-gst"
version = "0.2.0a1"
description = "Local GST purchase reconciliation and monthly filing working papers"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "openpyxl>=3.1.5,<4", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[project.scripts]
monthly-gst = "monthly_gst.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
